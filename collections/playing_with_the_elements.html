<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080808">
    <link rel="icon" href="../assets/Minimalist%20Italic%20i%20Icon.ico" type="image/x-icon">
    <title>thisisacryforhelp</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="../script.js" data-site-root="../" defer></script>
</head>
<body class="is-loading" data-page="collection" data-collection-id="playing_with_the_elements" data-landing="../home.html">
    <div class="loading-screen"><div class="loading-indicator"><span class="loading-label">loading...</span><span class="loading-bar" role="progressbar" aria-label="Gallery loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></span></div></div>
    <header class="archive-header">
        <div class="site-identity">
            <a class="site-mark" href="../home.html"><span class="site-title">this is a cry for help</span></a>
            <span class="page-label">playing with the elements</span>
        </div>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="../collections.html">collections</a>
            <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="false">sound: off</button>
        </nav>
    </header>
    <main class="archive-main collection-main">
        <p class="collection-id" id="collection-id"></p>
        <div class="photo-grid" id="photo-grid" aria-label="Photographs"></div>
        <p class="gallery-status" id="gallery-status" role="status" hidden></p>
        <div class="collection-ending" id="collection-ending" hidden>
            <p>end of collection</p>
            <a href="../collections.html">back to collections</a>
        </div>
    </main>
    <footer class="archive-footer">
        <a id="contact-link" href="mailto:thisisacryforhelp.photography@gmail.com">contact</a>
    </footer>
    <dialog class="image-viewer" id="image-viewer" aria-label="Photograph viewer">
        <div class="viewer-shell">
            <div class="viewer-topline">
                <p class="viewer-count" id="viewer-count"></p>
                <button class="viewer-button viewer-close" id="viewer-close" type="button" aria-label="Close photograph viewer">close</button>
            </div>
            <div class="viewer-stage">
                <img class="viewer-image" id="viewer-image" alt="">
                <aside class="viewer-info-panel" id="viewer-info-panel" aria-label="Technical information"></aside>
            </div>
            <div class="viewer-bottomline">
                <div class="viewer-details" id="viewer-details"></div>
                <div class="viewer-controls">
                    <span class="viewer-end" id="viewer-end" hidden>end of collection</span>
                    <button class="viewer-button viewer-info-button" id="viewer-info" type="button" aria-pressed="false">info</button>
                    <button class="viewer-button" id="viewer-previous" type="button" aria-label="Previous photograph">←</button>
                    <button class="viewer-button" id="viewer-next" type="button" aria-label="Next photograph">→</button>
                </div>
            </div>
        </div>
    </dialog>
</body>
</html>
